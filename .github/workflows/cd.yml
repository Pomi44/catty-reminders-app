name: CD (compose over SSH)

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Поднимем ssh-agent и загрузим приватный ключ из секретов
      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Общие переменные
      - name: Set variables
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LOWER=${OWNER_LOWER}" >> $GITHUB_ENV
          echo "IMAGE_NAME=ghcr.io/${OWNER_LOWER}/catty-reminders-app:latest" >> $GITHUB_ENV
          echo "APP_DIR=/home/hassiy/apps/catty-reminders-app" >> $GITHUB_ENV
          echo "SERVER_USER=hassiy" >> $GITHUB_ENV
          echo "SERVER_HOST=course.prafdin.ru" >> $GITHUB_ENV
          echo "SERVER_PORT=2472" >> $GITHUB_ENV

      # Убедимся, что папка есть, и скопируем compose/.env/config.json (если файлы существуют)
      - name: Ensure remote dir and copy files
        run: |
          ssh -o StrictHostKeyChecking=no -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p '$APP_DIR'"

          # docker-compose.yml — обязателен
          scp -P "$SERVER_PORT" -o StrictHostKeyChecking=no docker-compose.yml "$SERVER_USER@$SERVER_HOST:$APP_DIR/docker-compose.yml"

          # .env и config.json — если есть в репо, скопируем; если нет — пропустим
          if [ -f .env ]; then
            scp -P "$SERVER_PORT" -o StrictHostKeyChecking=no .env "$SERVER_USER@$SERVER_HOST:$APP_DIR/.env"
          fi

          if [ -f config.json ]; then
            scp -P "$SERVER_PORT" -o StrictHostKeyChecking=no config.json "$SERVER_USER@$SERVER_HOST:$APP_DIR/config.json"
          fi

      # Деплой на сервере
      - name: Deploy with Docker Compose on server
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          ssh -o StrictHostKeyChecking=no -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "
            set -euxo pipefail
            cd '$APP_DIR'

            # GHCR login: имя владельца строго в нижнем регистре
            echo '$GHCR_TOKEN' | docker login ghcr.io -u '$OWNER_LOWER' --password-stdin

            # На всякий случай закрыть локальный uvicorn, который может занимать 8181 (из ЛР2)
            pkill -f 'uvicorn .*--port 8181' || true

            # Подтянуть свежие образы и поднять стек
            docker compose pull
            docker compose up -d --remove-orphans

            # Быстрая проверка
            docker compose ps
            sleep 2
            curl -sI http://127.0.0.1:8181/ || true
          "
