name: CD (compose over SSH)

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Decode SSH key and test SSH
        shell: bash
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY_B64 }}" ]; then
            echo "❌ SSH_PRIVATE_KEY_B64 is empty"; exit 1;
          fi
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > key.pem
          chmod 600 key.pem
          ssh -i key.pem -p 2472 -o StrictHostKeyChecking=no hassiy@course.prafdin.ru 'echo "✅ SSH OK"'

      - name: Set variables
        run: |
          echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "APP_DIR=/home/hassiy/apps/catty-reminders-app" >> $GITHUB_ENV

      - name: Ensure remote dir and upload compose/env/config
        shell: bash
        run: |
          ssh -i key.pem -p 2472 -o StrictHostKeyChecking=no hassiy@course.prafdin.ru "mkdir -p '${APP_DIR}'"
          scp -i key.pem -P 2472 -o StrictHostKeyChecking=no docker-compose.yml hassiy@course.prafdin.ru:"${APP_DIR}/docker-compose.yml"
          scp -i key.pem -P 2472 -o StrictHostKeyChecking=no .env hassiy@course.prafdin.ru:"${APP_DIR}/.env"
          scp -i key.pem -P 2472 -o StrictHostKeyChecking=no config.json hassiy@course.prafdin.ru:"${APP_DIR}/config.json"

      - name: Deploy (docker compose up -d)
        shell: bash
        run: |
          ssh -i key.pem -p 2472 -o StrictHostKeyChecking=no hassiy@course.prafdin.ru bash -s <<'EOSSH'
          set -euxo pipefail

          APP_DIR="${APP_DIR}"
          OWNER_LC="${OWNER_LC}"

          cd "${APP_DIR}"

          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${OWNER_LC}" --password-stdin

          docker ps --format '{{.ID}} {{.Ports}}' \
            | awk '$0 ~ /:8181->/ {print $1}' \
            | xargs -r docker rm -f

          # На всякий случай: если локально крутится uvicorn на 8181 — завершим его (без sudo)
          pkill -f 'uvicorn .*--port 8181' || true

          # Обновим образы и поднимем стэк
          docker compose pull
          docker compose up -d --remove-orphans

          docker compose ps
          sleep 2
          curl -sI http://127.0.0.1:8181/ || true
          EOSSH
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          APP_DIR: ${{ env.APP_DIR }}
          OWNER_LC: ${{ env.OWNER_LC }}
