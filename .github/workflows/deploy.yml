name: CD Deploy

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check SSH_PRIVATE_KEY_B64
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY_B64 }}" ]; then
            echo "❌ SSH_PRIVATE_KEY_B64 is empty or not visible to this job"; exit 1;
          fi
          echo "✅ SSH_PRIVATE_KEY_B64 length: $(echo '${{ secrets.SSH_PRIVATE_KEY_B64 }}' | wc -c) bytes"

      - name: Decode SSH key and test connection
        shell: bash
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > key.pem
          chmod 600 key.pem
          echo "🔑 Testing SSH connection..."
          ssh -i key.pem -p 2472 -o StrictHostKeyChecking=no hassiy@course.prafdin.ru 'echo "✅ SSH connection OK"'

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: course.prafdin.ru
          username: hassiy
          port: 2472
          key_path: key.pem
          script_stop: true
          timeout: 60s
          command_timeout: 10m
          debug: true
          script: |
            set -euxo pipefail

            # Всегда lowercase для GHCR
            OWNER_LC="$(echo 'pomi44' | tr '[:upper:]' '[:lower:]')"
            IMAGE="ghcr.io/${OWNER_LC}/catty-reminders-app:latest"

            echo "🔐 Logging in to GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${OWNER_LC}" --password-stdin
            echo "✅ GHCR login successful"

            echo "🛑 Stopping systemd service (if exists)"
            sudo systemctl stop catty-reminders.service 2>/dev/null || true
            sudo systemctl disable catty-reminders.service 2>/dev/null || true

            echo "🧹 Removing existing container (if any)"
            docker rm -f catty-reminders 2>/dev/null || true

            echo "🧹 Removing containers using port 8181 (if any)"
            docker ps --format '{{.ID}} {{.Ports}}' \
              | awk '$0 ~ /:8181->/ {print $1}' \
              | xargs -r docker rm -f

            echo "🔪 Killing non-Docker processes using port 8181 (if any)"
            sudo -n fuser -k 8181/tcp 2>/dev/null || true
            (sudo -n lsof -ti :8181 2>/dev/null || true) | xargs -r sudo -n kill -9 || true

            echo "⏳ Waiting for port 8181 to be free..."
            for i in {1..20}; do
              if ss -ltn '( sport = :8181 )' | grep -q 8181; then
                sleep 1
              else
                break
              fi
            done

            echo "⬇️ Pulling latest Docker image..."
            docker pull "${IMAGE}"

            echo "🔎 Pulled images with digests:"
            docker image ls "${IMAGE%:*}" --digests

            echo "🚀 Starting new container..."
            docker run -d --name catty-reminders -p 8181:8181 --restart=always "${IMAGE}"

            echo "🩺 Checking container health..."
            for i in {1..15}; do
              if curl -fsS http://127.0.0.1:8181/ >/dev/null; then
                echo "✅ App is running"
                break
              fi
              sleep 1
            done || true

            echo "📦 Active containers:"
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}\t{{.Ports}}'

            echo "✅ Deployment complete!"
